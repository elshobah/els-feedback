# ============================================================================
# DEVELOPMENT infrastructure only — Postgres, MinIO, Dragonfly, Mailpit.
# Started by `bun run setup` / `bun run dev`; the app itself runs on the host
# via `bun run dev`, so there is NO app service here.
#
# Values are read from `.env` in this directory (Docker Compose interpolates it
# automatically) and fall back to the dev defaults below when unset, so a fresh
# clone still works with no `.env` at all. The variable names match
# `.env.prod.example`. If you override POSTGRES_* here, update DATABASE_URL in
# `.env` to match — Compose cannot derive one from the other.
#
# The defaults are insecure (postgres/password, minioadmin), datastore ports are
# published on the host, and the upload bucket is world-readable — all fine for
# local development, NOT safe on an internet-facing host.
#
# To self-host Quackback, use docker-compose.prod.yml instead (app included,
# hardened defaults). See the self-hosting docs.
# ============================================================================

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: quackback-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped
    # BullMQ requires cluster_mode=emulated + lock_on_hashtags for Lua script compatibility.
    # Queue names use hashtags (e.g. {event-hooks}) to pin keys to a single thread.
    # See: https://www.dragonflydb.io/docs/integrations/bullmq
    command: dragonfly --cluster_mode=emulated --lock_on_hashtags
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: quackback-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025' # Web UI
      - '${MAILPIT_SMTP_PORT:-1025}:1025' # SMTP
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025/api/v1/info']
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates MinIO bucket and sets public download policy on startup
  minio-init:
    image: minio/mc:latest
    container_name: quackback-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-quackback}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb local/\"$$S3_BUCKET\" --ignore-existing;
      mc anonymous set download local/\"$$S3_BUCKET\";
      exit 0;
      "
    restart: 'no'

volumes:
  postgres_data:
  minio_data:
  dragonfly_data:
